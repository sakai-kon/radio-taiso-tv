<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f8f4">
  <meta name="description" content="ラジオ体操第一・第二をページ内のYouTube公式プレーヤーで再生します。">
  <title>ラジオ体操</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c2b21;
      --muted: #5c6a60;
      --green: #176b43;
      --green-dark: #105436;
      --blue: #226ba5;
      --blue-dark: #18517e;
      --paper: #f4f8f4;
      --focus: #f1b936;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      padding: max(22px, env(safe-area-inset-top)) 22px max(24px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 50% -15%, #e2f0e3 0, transparent 55%), var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    }
    button { font: inherit; }
    main { width: min(100%, 1050px); margin: auto; }
    #menu header { text-align: center; margin-bottom: clamp(20px, 4vh, 36px); }
    .eyebrow {
      display: inline-block;
      margin-bottom: 10px;
      padding: 7px 15px;
      border: 1px solid #cfe0d1;
      border-radius: 999px;
      background: #ffffffc9;
      color: var(--green-dark);
      font-size: clamp(.85rem, 1.5vw, 1rem);
      font-weight: 800;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 6vw, 4.7rem);
      line-height: 1.15;
      letter-spacing: .04em;
    }
    .lead {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: clamp(1.05rem, 2.1vw, 1.4rem);
    }
    .choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(14px, 2.5vw, 24px);
    }
    .choice {
      min-height: clamp(210px, 34vh, 310px);
      border: 0;
      border-radius: 26px;
      padding: clamp(20px, 3vw, 36px);
      color: white;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      box-shadow: 0 10px 24px #183b271c;
      transition: transform .12s ease, box-shadow .12s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .choice.first { background: linear-gradient(145deg, #218653, var(--green-dark)); }
    .choice.second { background: linear-gradient(145deg, #3284be, var(--blue-dark)); }
    .choice:hover { transform: translateY(-2px); box-shadow: 0 14px 28px #183b2728; }
    .choice:active { transform: scale(.985); }
    .ordinal { font-size: clamp(1.1rem, 2.5vw, 1.5rem); font-weight: 700; }
    .choice strong {
      font-size: clamp(2rem, 4.8vw, 3.4rem);
      line-height: 1.25;
      text-align: center;
    }
    .play-label {
      padding: 11px 24px;
      border: 1px solid #ffffff70;
      border-radius: 999px;
      background: #ffffff22;
      font-size: clamp(1.05rem, 2vw, 1.3rem);
      font-weight: 800;
    }
    .hint {
      margin: 21px 0 0;
      text-align: center;
      color: var(--muted);
      font-size: clamp(.9rem, 1.5vw, 1.05rem);
      line-height: 1.6;
    }

    /* 再生中も通常のページ表示にし、動画の周囲に余白を残す。
       サイト側の文字やボタンを動画の上に重ねない。 */
    #playerView {
      display: none;
      width: 100%;
      padding: clamp(12px, 2.2vw, 26px);
      border-radius: 24px;
      background: #ffffff;
      box-shadow: 0 8px 28px #183b2714;
    }
    #playerView.active { display: block; }
    #videoFrame {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
    }
    #videoFrame iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .playerFooter {
      display: flex;
      justify-content: center;
      padding-top: clamp(14px, 2vw, 22px);
    }
    #backButton {
      border: 1px solid #cbd9ce;
      border-radius: 14px;
      padding: 12px 24px;
      min-height: 48px;
      background: #f0f5f0;
      color: #244331;
      font-size: clamp(1rem, 1.7vw, 1.2rem);
      font-weight: 800;
      cursor: pointer;
    }
    #backButton:hover { background: #e5efe6; }
    :focus-visible { outline: 5px solid var(--focus); outline-offset: 5px; }
    @media (max-width: 640px) {
      body { align-items: flex-start; padding-top: max(28px, env(safe-area-inset-top)); }
      .choices { grid-template-columns: 1fr; }
      .choice { min-height: 185px; border-radius: 22px; }
      #playerView { padding: 10px; border-radius: 16px; margin-top: 20px; }
      #videoFrame { border-radius: 9px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <section id="menu">
      <header>
        <span class="eyebrow">いつでも かんたん再生</span>
        <h1>ラジオ体操</h1>
        <p class="lead">見たい体操を選んでください</p>
      </header>

      <div class="choices" aria-label="ラジオ体操を選ぶ">
        <button class="choice first" type="button" data-video="first">
          <span class="ordinal">その1</span>
          <strong>ラジオ体操<br>第一</strong>
          <span class="play-label">▶ 再生する</span>
        </button>
        <button class="choice second" type="button" data-video="second">
          <span class="ordinal">その2</span>
          <strong>ラジオ体操<br>第二</strong>
          <span class="play-label">▶ 再生する</span>
        </button>
      </div>
      <p class="hint">見たい体操のボタンを押してください。</p>
    </section>

    <section id="playerView" aria-label="動画再生">
      <div id="videoFrame"></div>
      <div class="playerFooter">
        <button id="backButton" type="button">← メニューに戻る</button>
      </div>
    </section>
  </main>

  <script>
    // かんぽ生命公式「ラジオ体操チャンネル」の動画
    const videos = {
      first:  { title: "ラジオ体操 第一", id: "_YZZfaMGEOU" },
      second: { title: "ラジオ体操 第二", id: "yi1TbzML2cU" }
    };

    const menu = document.getElementById("menu");
    const playerView = document.getElementById("playerView");
    const videoFrame = document.getElementById("videoFrame");
    const backButton = document.getElementById("backButton");

    function startVideo(key) {
      const video = videos[key];
      if (!video) return;

      // YouTube公式プレーヤーをサイト内に埋め込む。全画面化は自動実行しない。
      videoFrame.replaceChildren();
      const iframe = document.createElement("iframe");
      const params = new URLSearchParams({
        autoplay: "1",
        controls: "1",
        playsinline: "1",
        fs: "0",
        rel: "0",
        hl: "ja"
      });
      iframe.src = `https://www.youtube-nocookie.com/embed/${video.id}?${params.toString()}`;
      iframe.title = video.title;
      iframe.allow = "autoplay; encrypted-media; picture-in-picture";
      iframe.referrerPolicy = "strict-origin-when-cross-origin";
      videoFrame.appendChild(iframe);

      menu.style.display = "none";
      playerView.classList.add("active");
      backButton.focus();
    }

    function returnToMenu() {
      // iframeを削除すると再生も停止する
      videoFrame.replaceChildren();
      playerView.classList.remove("active");
      menu.style.display = "";
      const firstButton = document.querySelector('[data-video="first"]');
      if (firstButton) firstButton.focus();
    }

    document.querySelectorAll("[data-video]").forEach(button => {
      button.addEventListener("click", () => startVideo(button.dataset.video));
    });
    backButton.addEventListener("click", returnToMenu);

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" || event.key === "Backspace") {
        if (playerView.classList.contains("active")) {
          event.preventDefault();
          returnToMenu();
        }
      }
    });
  </script>
</body>
</html>
